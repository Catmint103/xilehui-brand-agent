name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tests/validate_package.py
      - run: python skills/create-xilehui-brand-poster/scripts/brand_assets.py verify
      - run: bash -n install.sh scripts/create-workspace.sh
